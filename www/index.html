<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b3d63">
<title>Seamaster Scout</title><link rel="icon" href="icon.png"><link rel="apple-touch-icon" href="icon.png">
<style>
:root{--bg1:#eef0f3;--bg2:#dde2e8;--ink:#14232d;--mute:#5a6b77;--card:#fff;--line:#d0d7de;--navy:#0b3d63;--navy2:#165b8f;--gold:#e8b100;--new:#d3122f}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,var(--bg1),var(--bg2)) fixed;color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding:max(0px,env(safe-area-inset-top)) 16px 56px}
main{max-width:1000px;margin:0 auto}
.hero{position:relative;margin:14px 0 18px;padding:20px;display:flex;gap:14px;align-items:center;color:#fff;background:linear-gradient(135deg,#072d4a,#0f5486 55%,#0a3b63);border-radius:20px;box-shadow:0 10px 26px rgba(7,45,74,.3);overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.26),rgba(255,255,255,0) 45%);pointer-events:none}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.logo{width:58px;height:58px;flex:none;filter:drop-shadow(0 3px 6px rgba(0,0,0,.45))}
h1{font:700 26px/1.1 Georgia,"Times New Roman",serif;margin:0;letter-spacing:.3px;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.sub{color:var(--mute);font-size:14px}.hero .sub{color:#cfe3f3;margin-top:4px}
button,select,input{font:inherit}
.btn{border:0;border-radius:10px;padding:11px 20px;font-weight:700;color:#fff;cursor:pointer;background:linear-gradient(180deg,#2273ad,var(--navy) 55%,#082f4d);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 3px 8px rgba(11,61,99,.35);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:translateY(1px)}
.btn.ghost{color:var(--navy);background:linear-gradient(180deg,#fff,#e9edf1);border:1px solid #b9c4cd;box-shadow:inset 0 1px 0 #fff,0 2px 5px rgba(0,0,0,.08)}
.btn:disabled{opacity:.55;cursor:wait}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.menu{display:grid;gap:14px}
.opt{display:flex;gap:16px;align-items:center;text-align:left;width:100%;padding:18px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(180deg,#fff,#f3f5f7);box-shadow:0 2px 8px rgba(20,35,45,.08),inset 0 1px 0 #fff;cursor:pointer;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s,border-color .2s;color:inherit}
.opt::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.8),transparent);transform:skewX(-20deg);transition:left .6s;pointer-events:none}
.opt:hover{transform:translateY(-2px);border-color:var(--navy2);box-shadow:0 10px 22px rgba(11,61,99,.18)}.opt:hover::after{left:120%}
.opt b{display:block;font-size:18px}.opt .d{color:var(--mute);font-size:14px}
.ic{flex:none;width:54px;height:54px;border-radius:15px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,#3a96d4,#0b3d63);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 4px 10px rgba(11,61,99,.3)}
.ic svg{width:28px;height:28px}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin:6px 0 14px}
.bar b{font:700 21px Georgia,serif}
.filters{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;background:rgba(255,255,255,.85);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;box-shadow:0 2px 8px rgba(20,35,45,.06)}
.filters input[type=number],select{border:1px solid #b9c4cd;border-radius:8px;padding:7px 8px;background:#fff;color:var(--ink)}
.filters input[type=checkbox]{accent-color:var(--navy);width:16px;height:16px}
#st{color:var(--mute);font-size:14px;margin:14px 2px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
.c{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 2px 8px rgba(20,35,45,.08);transition:transform .2s,box-shadow .2s}
.c:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(11,61,99,.2)}
.c::after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);pointer-events:none;transition:left .7s}
.c:hover::after{left:130%}
.c a.m{color:inherit;text-decoration:none;display:block}
.c img{width:100%;aspect-ratio:1;object-fit:cover;background:radial-gradient(circle at 35% 30%,#f3f5f7,#cdd4da);display:block;transition:transform .4s}
.c:hover img{transform:scale(1.04)}
.c .i{padding:12px 14px 6px}
.t{font-weight:600;font-size:14px;line-height:1.3;max-height:4em;overflow:hidden}
.o{color:var(--mute);font-size:11px;margin-top:3px;max-height:2.6em;overflow:hidden}
.p{display:inline-block;margin-top:9px;padding:3px 12px;border-radius:99px;font:800 16px system-ui;color:#fff;background:linear-gradient(180deg,#2273ad,#0b3d63);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.tag{font-size:12px;color:var(--mute);margin-top:6px}
.c .x{padding:0 14px 12px;font-size:12px}.x a{color:var(--navy2);font-weight:600}
.nw{position:absolute;z-index:2;top:10px;left:10px;color:#fff;font-size:11px;font-weight:800;letter-spacing:.6px;padding:3px 10px;border-radius:99px;background:linear-gradient(180deg,#f0344f,var(--new));box-shadow:0 2px 8px rgba(211,18,47,.5),inset 0 1px 0 rgba(255,255,255,.5);animation:pl 2s infinite}
@keyframes pl{50%{box-shadow:0 2px 14px rgba(211,18,47,.85),inset 0 1px 0 rgba(255,255,255,.5)}}
.sk{aspect-ratio:3/4;border-radius:16px;background:linear-gradient(100deg,#dfe4e8 30%,#f4f6f8 50%,#dfe4e8 70%);background-size:200% 100%;animation:s 1.3s infinite}
@keyframes s{to{background-position:-200% 0}}
.links{margin-top:30px;font-size:14px;color:var(--mute)}.links a{color:var(--navy2);font-weight:600;margin-right:14px}
.mu{position:fixed;right:16px;bottom:max(16px,env(safe-area-inset-bottom));z-index:5;border-radius:99px;backdrop-filter:blur(8px)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main>
<header class="hero"><svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6f9fc"/><stop offset=".5" stop-color="#7f8d99"/><stop offset="1" stop-color="#eef2f6"/></linearGradient><radialGradient id="g2"><stop offset="0" stop-color="#47a3e6"/><stop offset="1" stop-color="#0b3d63"/></radialGradient></defs><circle cx="32" cy="32" r="30" fill="url(#g1)"/><circle cx="32" cy="32" r="25" fill="#0c1115"/><circle cx="32" cy="32" r="21" fill="url(#g2)"/><path d="M32 32L22 25M32 32L44 22" stroke="#fff" stroke-width="3" stroke-linecap="round"/><circle cx="32" cy="12.5" r="2.2" fill="#f2b705"/><circle cx="32" cy="32" r="2.4" fill="#f2b705"/><path d="M15 21a21 21 0 0 1 24-9" stroke="#fff" stroke-opacity=".55" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
<div><h1>Seamaster Scout</h1><div class="sub">Used Omega Seamaster Diver 300M finder</div></div></header>
<div id="menu" class="menu" hidden></div>
<section id="app" hidden>
  <div class="bar"><div><b id="mn"></b><div class="sub" id="when"></div></div>
    <div><button class="btn ghost" id="back">Change search</button> <button class="btn" id="u">Update</button></div></div>
  <div class="filters">
    <label>Max price ¥ <input id="max" type="number" step="50000" min="0" style="width:110px"></label>
    <label>Sort <select id="sort"><option value="new">Newest</option><option value="lo">Price: low to high</option><option value="hi">Price: high to low</option></select></label>
    <label><input type="checkbox" id="junk" checked> Hide boxes, straps, parts, new</label>
    <label><input type="checkbox" id="onlynew"> Only new since last check</label></div>
  <div id="st"></div><div id="grid"></div>
  <div class="links">More searches: <a id="l1" target="_blank" rel="noopener">Mercari</a><a id="l2" target="_blank" rel="noopener">Chrono24</a><a id="l3" target="_blank" rel="noopener">Komehyo</a><a id="l4" target="_blank" rel="noopener">2nd Street</a><a href="spy-theme.mid" download>Music (.mid)</a></div>
</section>
<button id="mu" class="btn ghost mu" aria-pressed="false">♪ Music: off</button>
<script>
const Q="オメガ シーマスター ダイバー300M",$=id=>document.getElementById(id);
const ya=l=>"https://auctions.yahoo.co.jp/search/search?p="+encodeURIComponent(Q)+(l?"&loc_cd="+l:"")+"&auccat=23140&s1=new&o1=d&n=50";
const yp=l=>"https://auctions.yahoo.co.jp/search/search/"+encodeURIComponent(Q)+"/0/?auccat=23140&s1=new&o1=d&n=50"+(l?"&loc_cd="+l:"");
const MODES={
 area:{name:"Osaka",sub:"Listings located in Osaka, same as the original search",jobs:()=>[{url:ya(27),alt:yp(27),tag:"Osaka"}]},
 japan:{name:"All of Japan, including online",sub:"Every prefecture plus online sellers",jobs:()=>[{url:ya(),alt:yp(),tag:"Japan"}]},
 takayama:{name:"Takayama pawn shop",sub:"Fukuoka area, one shop only (takayama78online.jp)",jobs:()=>[{url:"https://takayama78online.jp/shop/c/c105020/",tag:"Takayama",enc:"shift_jis"}]}};
const L={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const S={mode:null,items:[],when:0};
const JUNK=/空箱|箱のみ|ベルトのみ|ジャンク|部品取り|パーツ|ダミー|説明書のみ|新品(?!同様)|未使用|のみ$|互換|汎用|対応|シーマスター\s*コマ|コマ\s*\d+\s*コマ|文字板/;
const ICON={area:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>',japan:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>',takayama:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 9l1.5-5h13L20 9M4 9v11h16V9M4 9c0 2 3 2 4 0 1 2 3 2 4 0 1 2 3 2 4 0 1 2 4 2 4 0"/><path d="M10 20v-5h4v5"/></svg>'};
$("menu").innerHTML=Object.entries(MODES).map(([k,m])=>`<button class="opt" data-k="${k}"><span class="ic">${ICON[k]}</span><span><b>${m.name}</b><span class="d">${m.sub}</span></span></button>`).join("");
$("menu").onclick=e=>{const b=e.target.closest(".opt");if(b)open(b.dataset.k)};
$("back").onclick=()=>{L.set("mode",null);$("app").hidden=true;$("menu").hidden=false};
$("max").value=L.get("max",800000);
["max","sort","junk","onlynew"].forEach(i=>$(i).onchange=()=>{L.set("max",+$("max").value||0);render()});
$("u").onclick=update;
const enc=encodeURIComponent(Q);
$("l1").href="https://jp.mercari.com/search?keyword="+enc+"&sort=created_time&order=desc";
$("l2").href="https://www.chrono24.jp/search/index.htm?query="+encodeURIComponent("Omega Seamaster Diver 300M");
$("l3").href="https://www.komehyo.jp/search/?q="+enc;$("l4").href="https://www.2ndstreet.jp/search?keyword="+enc;

function open(k){
  S.mode=k;L.set("mode",k);$("menu").hidden=true;$("app").hidden=false;
  $("mn").textContent=MODES[k].name;
  const c=L.get("c_"+k,null);S.items=c?c.items:[];S.when=c?c.when:0;render();
  if(!c||Date.now()-c.when>36e5)update();
}
async function get(url,enc){
  const cap=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.CapacitorHttp;
  for(let i=0;i<2;i++){try{
    if(cap){const r=await cap.get({url,responseType:"arraybuffer",headers:{"Accept-Language":"ja","User-Agent":"Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Mobile Safari/537.36"}});if(r.status>=400)throw Error("HTTP "+r.status);
      return new TextDecoder(enc||"utf-8").decode(Uint8Array.from(atob(r.data),c=>c.charCodeAt(0)))}
    const r=await fetch("/proxy?url="+encodeURIComponent(url));if(!r.ok)throw Error(r.status==404?"No local server. Run server.py and open localhost:8000":"HTTP "+r.status);return r.text();
  }catch(e){if(i)throw e;await new Promise(r=>setTimeout(r,700))}}
}
const ITEM=/\/jp\/auction\/|\/shop\/g\//;
function pic(b,base){
  for(const i of b.querySelectorAll("img")){
    for(const k of ["data-src","data-original","data-lazy-src","src"]){
      const v=i.getAttribute(k)||"";
      if(v&&!/^data:/.test(v)&&!/\/img\/sys\/|\.svg$|icon_|\/na_\d/i.test(v.split("?")[0])){try{return new URL(v,base).href}catch(e){}}}
  }return "";
}
function parseA(html,base,tag){
  const d=new DOMParser().parseFromString(html,"text/html"),seen=new Set(),out=[];
  d.querySelectorAll("a[href]").forEach(a=>{
    let h;try{h=new URL(a.getAttribute("href"),base).href.split("?")[0]}catch(e){return}
    if(!ITEM.test(h)||seen.has(h))return;seen.add(h);
    let b=a;while(b.parentElement&&b.parentElement!==d.body){
      const n=new Set([...b.parentElement.querySelectorAll("a[href]")].map(x=>x.getAttribute("href").split("?")[0]).filter(x=>ITEM.test(x)));
      if(n.size>1)break;b=b.parentElement}
    const txt=b.textContent.replace(/\s+/g," ");
    const m=txt.match(/販売価格\s*([\d,]+)\s*円/)||txt.match(/現在\s*([\d,]+)\s*円/)||txt.match(/即決\s*([\d,]+)\s*円/)||txt.match(/([\d,]{4,})\s*円/);
    const t=[...b.querySelectorAll("a[href]")].filter(x=>{try{return new URL(x.getAttribute("href"),base).href.split("?")[0]===h}catch(e){return false}})
      .map(x=>(x.getAttribute("title")||x.textContent).trim()).sort((p,q)=>q.length-p.length)[0]||"";
    if(t.length<4)return;
    out.push({h,t:t.replace(/\s+/g," "),img:pic(b,base),p:m?parseInt(m[1].replace(/,/g,"")):0,tag});
  });return out;
}
function mine(html,tag){
  const out=[],seen=new Set();
  const take=o=>{
    const id=o.auctionId||o.auctionID||o.aucId||o.id;
    if(typeof id!=="string"||!/^[a-z]?\d{8,}$/i.test(id))return;
    const t=o.title||o.name;if(typeof t!=="string"||t.length<4||seen.has(id))return;seen.add(id);
    let p=o.price??o.currentPrice??o.nowPrice??o.bidPrice??o.buyNowPrice??0;if(typeof p==="string")p=parseInt(p.replace(/\D/g,""))||0;
    let im=o.imageUrl||o.image||o.img||o.thumbnail||"";if(im&&typeof im==="object")im=im.url||im.src||"";
    out.push({h:"https://auctions.yahoo.co.jp/jp/auction/"+id,t:t.replace(/\s+/g," "),img:typeof im==="string"?im:"",p:+p||0,tag});
  };
  const walk=o=>{if(!o||typeof o!=="object")return;if(Array.isArray(o))o.forEach(walk);else{take(o);Object.values(o).forEach(walk)}};
  new DOMParser().parseFromString(html,"text/html").querySelectorAll("script").forEach(sc=>{
    const x=sc.textContent.trim();if(!x)return;
    let m=null;if(x[0]==="{"||x[0]==="[")m=x;else{const q=x.match(/=\s*(\{[\s\S]*\})\s*;?\s*$/);if(q)m=q[1]}
    if(m)try{walk(JSON.parse(m))}catch(e){}});
  return out;
}
function raw(html,tag){
  const out=[],seen=new Set(),re=/"auctionId"\s*:\s*"([^"]+)"[\s\S]{0,2500}?"title"\s*:\s*"((?:[^"\\]|\\.)*)"/g;let m;
  while((m=re.exec(html))){if(seen.has(m[1]))continue;seen.add(m[1]);let t=m[2];try{t=JSON.parse('"'+t+'"')}catch(e){}
    const w=html.slice(m.index,m.index+3000),pm=w.match(/"price"\s*:\s*"?(\d+)/),im=w.match(/"(?:imageUrl|image|img)"\s*:\s*"(https?:[^"]+)"/);
    out.push({h:"https://auctions.yahoo.co.jp/jp/auction/"+m[1],t,img:im?im[1].replace(/\\u0026/g,"&").replace(/\\\//g,"/"):"",p:pm?+pm[1]:0,tag})}
  return out;
}
function extract(html,base,tag){let r=parseA(html,base,tag);if(r.length)return r;r=mine(html,tag);return r.length?r:raw(html,tag)}
function diag(h){const t=(h.match(/<title>([^<]{0,40})/)||[])[1]||"no title";return"title="+t+", links="+(h.match(/\/jp\/auction\//g)||[]).length+", ids="+(h.match(/auctionId/g)||[]).length+", next="+h.includes("__NEXT_DATA__")}
async function update(){
  const jobs=MODES[S.mode].jobs(),info=[];
  $("u").disabled=true;$("st").textContent="Checking "+jobs.length+" source"+(jobs.length>1?"s":"")+"…";
  $("grid").innerHTML='<div class="sk"></div>'.repeat(4);
  const res=await Promise.allSettled(jobs.map(async j=>{let h=await get(j.url,j.enc),u=j.url,it=extract(h,u,j.tag);if(!it.length&&j.alt){h=await get(j.alt,j.enc);u=j.alt;it=extract(h,u,j.tag)}info.push(j.tag+": "+h.length+" chars, "+it.length+" listings ["+diag(h)+"]");return it}));
  const ok=res.filter(r=>r.status==="fulfilled"),bad=res.filter(r=>r.status==="rejected");
  if(!ok.length){$("st").textContent="Update failed: "+bad[0].reason.message;render();$("u").disabled=false;return}
  const u=new Map(),lists=ok.map(r=>r.value);
  for(let k=0;;k++){let any=false;for(const l of lists)if(l[k]){any=true;u.has(l[k].h)||u.set(l[k].h,l[k])}if(!any)break}
  if(!u.size){S.items=[];S.when=Date.now();render("Connected but found no listings ("+info.join("; ")+"). ");$("u").disabled=false;return}
  const prev=new Set(L.get("seen_"+S.mode,null)||[]),first=!prev.size;
  S.items=[...u.values()].map(i=>({...i,n:!first&&!prev.has(i.h)}));S.when=Date.now();
  L.set("c_"+S.mode,{items:S.items,when:S.when});
  L.set("seen_"+S.mode,[...new Set([...prev,...S.items.map(i=>i.h)])].slice(-600));
  render(bad.length?bad.length+" source(s) failed. ":"");$("u").disabled=false;
}
const N=t=>t.normalize("NFKC");
const GL=[["オメガ","Omega"],["シーマスター","Seamaster"],["ダイバー","Diver"],["プロフェッショナル","Professional"],["コーアクシャル","Co-Axial"],["マスタークロノメーター","Master Chronometer"],["クロノメーター","Chronometer"],["クロノグラフ","Chronograph"],["自動巻き","Automatic"],["自動巻","Automatic"],["クォーツ","Quartz"],["クオーツ","Quartz"],["腕時計","Watch"],["メンズ","Men's"],["ボーイズ","Boys'"],["レディース","Ladies'"],["ブルー","Blue"],["ブラック","Black"],["グリーン","Green"],["ホワイト","White"],["青文字盤","Blue dial"],["黒文字盤","Black dial"],["文字盤","dial"],["ステンレス","Stainless steel"],["チタン","Titanium"],["エディション","Edition"],["保証書","Warranty card"],["保証","Warranty"],["付属品","Accessories"],["余りコマ","Spare links"],["箱","Box"],["カード","Card"],["付き","Included"],["極美品","Mint"],["美品","Excellent"],["中古","Used"],["稼働品","Working"],["稼働","Working"],["完品","Complete set"],["送料無料","Free shipping"],["本体","Watch only"],["ブレスレット","Bracelet"],["ブレス","Bracelet"],["ベルト","Strap"],["ラバー","Rubber"],["デイト","Date"],["日付","Date"],["ダイビング","Diving"],["ヘリウム","Helium"],["オーバーホール済","Serviced"],["オーバーホール","Overhaul"],["動作確認済","Tested"],["ケース","Case"],["限定","Limited"],["ランク","Grade"],["品","item"]].sort((a,b)=>b[0].length-a[0].length);
const GM=Object.fromEntries(GL),GR=new RegExp(GL.map(x=>x[0]).join("|"),"g");
const en=t=>N(t).replace(GR,m=>" "+GM[m]+" ").replace(/[【】『』「」★☆◆◇■□●○]/g," ").replace(/\s+/g," ").trim();
function render(note=""){
  const max=+$("max").value||0,j=$("junk").checked,nw=$("onlynew").checked;
  let v=S.items.filter(i=>/シーマスター|seamaster/i.test(N(i.t))&&/300|ダイバー|diver/i.test(N(i.t)));
  if(j)v=v.filter(i=>!JUNK.test(N(i.t)));
