<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<style>
:root{--bg1:#eef0f3;--bg2:#dde2e8;--ink:#14232d;--mute:#5a6b77;--card:#fff;--line:#d0d7de;--navy:#0c3a5c;--navy2:#0f86a8;--gold:#f2b01e;--new:#d3122f}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,var(--bg1),var(--bg2)) fixed;color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding:max(0px,env(safe-area-inset-top)) 16px 56px}
main{max-width:1000px;margin:0 auto}
.hero{position:relative;margin:14px 0 18px;padding:20px;display:flex;gap:14px;align-items:center;color:#fff;background:linear-gradient(120deg,#06283f,#0d5a80 52%,#0f8aa8);border-radius:20px;box-shadow:0 10px 26px rgba(7,45,74,.3);overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.26),rgba(255,255,255,0) 45%);pointer-events:none}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.logo{width:58px;height:58px;flex:none;filter:drop-shadow(0 3px 6px rgba(0,0,0,.45))}
h1{font:700 26px/1.1 Georgia,"Times New Roman",serif;margin:0;letter-spacing:.3px;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.sub{color:var(--mute);font-size:14px}.hero .sub{color:#cfe3f3;margin-top:4px}
button,select,input{font:inherit}
.btn{border:0;border-radius:10px;padding:11px 20px;font-weight:700;color:#fff;cursor:pointer;background:linear-gradient(180deg,#2273ad,var(--navy) 55%,#082f4d);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 3px 8px rgba(11,61,99,.35);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:translateY(1px)}
.btn.ghost{color:var(--navy);background:linear-gradient(180deg,#fff,#e9edf1);border:1px solid #b9c4cd;box-shadow:inset 0 1px 0 #fff,0 2px 5px rgba(0,0,0,.08)}

:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.menu{display:grid;gap:14px}
.opt{display:flex;gap:16px;align-items:center;text-align:left;width:100%;padding:18px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(180deg,#fff,#f3f5f7);box-shadow:0 2px 8px rgba(20,35,45,.08),inset 0 1px 0 #fff;cursor:pointer;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s,border-color .2s;color:inherit}
.opt::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.8),transparent);transform:skewX(-20deg);transition:left .6s;pointer-events:none}
.opt:hover{transform:translateY(-2px);border-color:var(--navy2);box-shadow:0 10px 22px rgba(11,61,99,.18)}.opt:hover::after{left:120%}
.opt b{display:block;font-size:18px}.opt .d{color:var(--mute);font-size:14px}
.ic{flex:none;width:54px;height:54px;border-radius:15px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,#3a96d4,#0b3d63);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 4px 10px rgba(11,61,99,.3)}
.ic svg{width:28px;height:28px}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin:6px 0 14px}

.filters input[type=number],select{border:1px solid #b9c4cd;border-radius:8px;padding:7px 8px;background:#fff;color:var(--ink)}
.filters input[type=checkbox]{accent-color:var(--navy);width:16px;height:16px}
#st{color:var(--mute);font-size:14px;margin:14px 2px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
.c{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 2px 8px rgba(20,35,45,.08);transition:transform .2s,box-shadow .2s}

.c:hover::after{left:130%}
.c a.m{color:inherit;text-decoration:none;display:block}
.c img{width:100%;aspect-ratio:1;object-fit:cover;background:radial-gradient(circle at 35% 30%,#f3f5f7,#cdd4da);display:block;transition:transform .4s}

.c .i{padding:12px 14px 6px}
.t{font-weight:600;font-size:14px;line-height:1.3;max-height:4em;overflow:hidden}
.o{color:var(--mute);font-size:11px;margin-top:3px;max-height:2.6em;overflow:hidden}
.p{display:inline-block;margin-top:9px;padding:3px 12px;border-radius:99px;font:800 16px system-ui;color:#fff;background:linear-gradient(180deg,#2273ad,#0b3d63);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.tag{font-size:12px;color:var(--mute);margin-top:6px}
.c .x{padding:0 14px 12px;font-size:12px}.x a{color:var(--navy2);font-weight:600}
.nw{position:absolute;z-index:2;top:10px;left:10px;color:#fff;font-size:11px;font-weight:800;letter-spacing:.6px;padding:3px 10px;border-radius:99px;background:linear-gradient(180deg,#f0344f,var(--new));box-shadow:0 2px 8px rgba(211,18,47,.5),inset 0 1px 0 rgba(255,255,255,.5);animation:pl 2s infinite}
@keyframes pl{50%{box-shadow:0 2px 14px rgba(211,18,47,.85),inset 0 1px 0 rgba(255,255,255,.5)}}
.sk{aspect-ratio:3/4;border-radius:16px;background:linear-gradient(100deg,#dfe4e8 30%,#f4f6f8 50%,#dfe4e8 70%);background-size:200% 100%;animation:s 1.3s infinite}
@keyframes s{to{background-position:-200% 0}}
.links{margin-top:30px;font-size:14px;color:var(--mute)}.links a{color:var(--navy2);font-weight:600;margin-right:14px}
.mu{position:fixed;right:16px;bottom:max(16px,env(safe-area-inset-bottom));z-index:5;border-radius:99px;backdrop-filter:blur(8px)}
details{margin-top:22px;background:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:14px;padding:4px 14px;box-shadow:0 2px 8px rgba(20,35,45,.06)}
summary{cursor:pointer;font-weight:700;padding:10px 0;color:var(--navy)}
.sr{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.sr a{color:var(--navy2);font-weight:600;margin-left:12px;white-space:nowrap}
.add{display:flex;gap:8px;padding:12px 0 14px;border-top:1px solid var(--line)}.add input{flex:1;min-width:0;border:1px solid #b9c4cd;border-radius:8px;padding:8px}
#sum{font-size:12.5px;color:var(--mute);background:rgba(255,255,255,.75);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:0 0 14px}#sum:empty{display:none}#sum div{padding:3px 0}#sum b{color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}.chips button{border:1px solid #b9c4cd;background:linear-gradient(180deg,#fff,#e9edf1);color:var(--navy);border-radius:99px;padding:8px 14px;font-weight:700;cursor:pointer;box-shadow:inset 0 1px 0 #fff}.chips button.on{color:#fff;border-color:var(--navy);background:linear-gradient(180deg,#2273ad,var(--navy) 55%,#082f4d);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 2px 6px rgba(11,61,99,.3)}
.ph{position:relative}.pr{position:absolute;right:8px;bottom:8px;color:#fff;font:800 15px system-ui;padding:4px 11px;border-radius:99px;background:linear-gradient(180deg,rgba(20,120,168,.95),rgba(8,47,77,.95));box-shadow:0 2px 8px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.4)}.sc{position:absolute;right:8px;top:8px;font:700 11px system-ui;color:var(--navy);padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.9);backdrop-filter:blur(4px);box-shadow:0 1px 4px rgba(0,0,0,.2)}.c.dim{opacity:.6;filter:grayscale(.7)}.wy{position:absolute;z-index:2;left:0;right:0;bottom:0;background:rgba(20,35,45,.82);color:#fff;font:600 12px system-ui;padding:5px 10px;text-align:center}.tag{min-height:1em}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main>

<div><h1>Seamaster Scout</h1><div class="sub">Seamaster Diver 300M · Black Bay Pro · Superocean Heritage</div></div></header>

</section>

<script>
const Q="オメガ シーマスター ダイバー300M コーアクシャル",$=id=>document.getElementById(id);
const ya=(l,q)=>"https://auctions.yahoo.co.jp/search/search?p="+encodeURIComponent(q||WATCHES.omega.q)+(l?"&loc_cd="+l:"")+"&auccat=23140&s1=new&o1=d&n=50";

const tk=ws=>ws.map(k=>({url:TK[k],tag:"Takayama",enc:"shift_jis",fl:true}));
function shopJobs(ws){
  const out=[],kq=q=>"https://komehyo.jp/watch-mens/?q="+encodeURIComponent(q)+"&sortKey=02",ok=q=>"https://ec.wb-ookura.com/search?type=product&q="+encodeURIComponent(q);
  const add=k=>{const W=WATCHES[k];for(const p of["","&page=2","&page=3"])out.push({url:kq(W.qs)+p,tag:"KOMEHYO",gen:true});for(const p of["","&page=2"])out.push({url:ok(W.qo)+p,tag:"OKURA ONLINE"})};

  if(ws.includes("tudor")){out.push({url:"https://www.rasin.co.jp/SHOP/85111/156586/list.html",tag:"GINZA RASIN",fl:true});add("tudor")}
  if(ws.includes("breitling"))add("breitling");
  return out;
}
const custom=()=>L.get("custom",[]).map(u=>({url:u,tag:new URL(u).hostname.replace(/^www\./,""),gen:true}));
const MODES={
 area:{name:"Osaka + 200 km",sub:"Brick-and-mortar shops within 200 km: GINZA RASIN, KOMEHYO, Kame-kichi, OKURA and more",jobs:ws=>[...shopJobs(ws),...custom()]},
 japan:{name:"All of Japan, including online",sub:"Yahoo Auctions plus every shop site, any location",jobs:ws=>[...ws.map(k=>({url:ya(0,WATCHES[k].q),alt:yp(0,WATCHES[k].q),tag:"Yahoo Auctions"})),...shopJobs(ws),...tk(ws),...(ws.includes("omega")?[{url:"https://housekihiroba.jp/shop/c/c01omdv03/",tag:"Hoseki Hiroba"},{url:"https://www.kingsroad.jp/SHOP/106783/106786/list.html",tag:"Zetton"}]:[]),...ws.map(k=>({url:"https://commit-watch.co.jp/search?type=product&q="+encodeURIComponent(WATCHES[k].qo),tag:"COMMIT Ginza"})),...custom()]},
 takayama:{name:"Takayama pawn shop",sub:"Fukuoka and Kumamoto stores, all three watches",jobs:ws=>tk(ws)}
};

const L={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const S={mode:null,w:L.get("w","all"),items:[],when:0};
const JUNK=/空箱|箱のみ|ベルトのみ|ジャンク|部品取り|パーツ|ダミー|説明書のみ|新品(?!同様)|未使用|のみ$|互換|汎用|対応|シーマスター\s*コマ|コマ\s*\d+\s*コマ|文字板/;
const ICON={area:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>',japan:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>',takayama:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 9l1.5-5h13L20 9M4 9v11h16V9M4 9c0 2 3 2 4 0 1 2 3 2 4 0 1 2 3 2 4 0 1 2 4 2 4 0"/><path d="M10 20v-5h4v5"/></svg>'};
$("menu").innerHTML=Object.entries(MODES).map(([k,m])=>`<button class="opt" data-k="${k}"><span class="ic">${ICON[k]}</span><span><b>${m.name}</b><span class="d">${m.sub}</span></span></button>`).join("");
$("menu").onclick=e=>{const b=e.target.closest(".opt");if(b)open(b.dataset.k)};
$("back").onclick=()=>{L.set("mode",null);$("app").hidden=true;$("menu").hidden=false};
$("max").value=L.get("max",800000);
["max","min","sort","junk","onlynew","spec","mv","stock","col","cmp","showall"].forEach(i=>$(i).onchange=()=>{L.set("max",+$("max").value||0);render()});
$("u").onclick=update;
function open(k){
  S.mode=k;L.set("mode",k);$("menu").hidden=true;$("app").hidden=false;
  $("mn").textContent=MODES[k].name;$("dir").hidden=k!=="area";if(!S.did){S.did=1;applyDef()}syncW();
  const c=L.get("c_"+k+"_"+S.w,null);S.items=c?c.items:[];S.when=c?c.when:0;render();
  if(!c||Date.now()-c.when>36e5)update();

async function get(url,enc){
  const cap=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.CapacitorHttp;
  for(let i=0;i<2;i++){try{
    if(cap){const r=await cap.get({url,responseType:"arraybuffer",headers:{"Accept-Language":"ja","User-Agent":"Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Mobile Safari/537.36"}});if(r.status>=400)throw Error("HTTP "+r.status);
      const bt=Uint8Array.from(atob(r.data),c=>c.charCodeAt(0));let cs=enc||((new TextDecoder("latin1").decode(bt.slice(0,3000)).match(/charset=["']?([\w-]+)/i)||[])[1])||"utf-8";let tx;try{tx=new TextDecoder(cs).decode(bt)}catch(e){tx=new TextDecoder().decode(bt)}return tx}
    const r=await fetch("/proxy?url="+encodeURIComponent(url));if(!r.ok)throw Error(r.status==404?"No local server. Run server.py and open localhost:8000":"HTTP "+r.status);return r.text();
  }catch(e){if(i)throw e;await new Promise(r=>setTimeout(r,700))}}
}
const ITEM=/\/jp\/auction\/|\/shop\/g\/|\/SHOP\/(?:U|z|used)-|\/items\/\d+|\/products\/[\w-]+|komehyo\.jp\/product\//;
function pic(b,base){
  for(const i of b.querySelectorAll("img")){
    for(const k of ["data-src","data-original","data-lazy-src","src"]){

      if(v&&!/^data:/.test(v)&&!/\/img\/sys\/|\.svg$|icon_|\/na_\d/i.test(v.split("?")[0])){try{return new URL(v,base).href}catch(e){}}}
  }return "";
}
function parseA(html,base,tag,gen){
  const isI=(h,x)=>ITEM.test(h)||(gen&&(!!x.querySelector("img")||/[¥￥]\s*[\d,]{4,}|[\d,]{4,}\s*円/.test(x.textContent)));
  const d=new DOMParser().parseFromString(html,"text/html"),seen=new Set(),out=[];
  d.querySelectorAll("a[href]").forEach(a=>{
    let h;try{h=new URL(a.getAttribute("href"),base).href.split("?")[0]}catch(e){return}
    if(!isI(h,a)||seen.has(h))return;seen.add(h);
    let b=a;while(b.parentElement&&b.parentElement!==d.body){
      const n=new Set([...b.parentElement.querySelectorAll("a[href]")].filter(x=>isI(x.getAttribute("href").split("?")[0],x)).map(x=>x.getAttribute("href").split("?")[0]));
      if(n.size>1)break;b=b.parentElement}
    const txt=b.textContent.normalize("NFKC").replace(/\s+/g," ");
    const tx=[...txt.matchAll(/(?:¥\s*([\d,]{4,})\s*\(\s*税込|([\d,]{4,})\s*円\s*\(\s*税込)/g)].pop();
    const m=tx?[0,tx[1]||tx[2]]:(txt.match(/販売価格\s*([\d,]+)\s*円/)||txt.match(/現在\s*([\d,]+)\s*円/)||txt.match(/即決\s*([\d,]+)\s*円/)||txt.match(/¥\s*([\d,]{4,})/)||txt.match(/([\d,]{4,})\s*円/));
    if(gen&&!m)return;
    let t=[...b.querySelectorAll("a[href]")].filter(x=>{try{return new URL(x.getAttribute("href"),base).href.split("?")[0]===h}catch(e){return false}}).map(x=>(x.getAttribute("title")||x.textContent).trim()).sort((p,q)=>q.length-p.length)[0]||"";
    t=t.normalize("NFKC").replace(/\s+/g," ").split(/\s(?:OMEGA\s*)?(?:ランク|Rank)[:：]/i)[0].replace(/^(.{8,}?)\s+\1(?=\s|$)/,"$1").trim();{const k=t.slice(0,10),j=t.indexOf(k,10);if(j>0)t=t.slice(0,j).trim()}
