name: Build APK
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: npm install && npx cap add android && npx @capacitor/assets generate --android --iconBackgroundColor '#0b3d63' --iconBackgroundColorDark '#0b3d63' && npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: {name: seamaster-scout-apk, path: android/app/build/outputs/apk/debug/app-debug.apk}
  apk-widget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: npm install && npx cap add android && npx @capacitor/assets generate --android --iconBackgroundColor '#0b3d63' --iconBackgroundColorDark '#0b3d63' && npx cap sync android
      - run: python3 widget/install_widget.py
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: {name: seamaster-scout-widget-apk, path: android/app/build/outputs/apk/debug/app-debug.apk}
